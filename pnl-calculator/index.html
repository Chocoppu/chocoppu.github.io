<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101216">
<title>先物 損益計算</title>
<script>
/* Apply the saved theme before first paint to prevent a dark/light flash. */
(() => {
  let theme = 'dark';
  try { if (localStorage.getItem('pnl-calculator-theme') === 'light') theme = 'light'; } catch (_) {}
  document.documentElement.dataset.theme = theme;
  document.querySelector('meta[name="theme-color"]').content =
    theme === 'light' ? '#f3f6fa' : '#101216';
})();
</script>
<style>
:root{--bg:#101216;--panel:#16171A;--input:#242832;--border:#2b303a;--text:#f1f3f6;--muted:#8f97a6;--blue:#2b6dff;--green:#14c78e;--red:#ff4d68;--shadow:0 18px 50px rgba(0,0,0,.28)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;padding:12px}button,input{font:inherit}.app{width:min(920px,100%);margin:0 auto}.title{margin:0 0 10px;font-size:1.08rem;font-weight:800;letter-spacing:.02em}.shell{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,.78fr);gap:12px}.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow)}.form-card{padding:14px}.result-card{padding:15px;min-height:100%}.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:#20242c;padding:4px;border-radius:11px;margin-bottom:10px}.seg button{border:0;color:var(--muted);background:transparent;border-radius:8px;padding:9px 12px;font-weight:800;cursor:pointer}.seg button.active.long{background:var(--green);color:#071b14}.seg button.active.short{background:var(--red);color:#fff}.field{margin-top:10px}.label{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:5px;color:var(--muted);font-size:.88rem}.input-wrap{display:flex;align-items:center;gap:9px;background:var(--input);border:1px solid transparent;border-radius:10px;padding:0 11px;min-height:40px}.input-wrap:focus-within{border-color:#4f7fff}input[type="number"],.grouped-input{width:100%;border:0;outline:0;background:transparent;color:var(--text);text-align:right;font-weight:800;font-size:1rem;min-width:0}input[type="number"]{appearance:textfield;-moz-appearance:textfield}input[type="number"]::-webkit-outer-spin-button,input[type="number"]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}.suffix{color:var(--muted);font-size:.88rem;white-space:nowrap}.lev-top{display:flex;align-items:center;gap:8px}.step{width:36px;height:38px;border:0;border-radius:9px;background:#2b303a;color:#c7ccd5;font-size:1.35rem;cursor:pointer}.value-box{flex:1;display:flex;align-items:center;justify-content:center;gap:2px;background:var(--input);border:1px solid transparent;border-radius:10px;padding:0 10px;font-weight:900}.value-box:focus-within{border-color:#4f7fff}.value-box input[type="number"]{width:4ch;padding:8px 0;text-align:right;font-weight:900;font-size:1rem}.value-box #leverageInput{width:5ch}.value-box .unit{margin-left:1px}.unit{color:var(--text);font-weight:900}.preset-row{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:6px}.preset-row button{border:0;border-radius:7px;background:#2a2e36;color:#aeb5c2;padding:5px 4px;cursor:pointer}.preset-row button.on{color:#fff;background:#3b4250}input[type="range"]{width:100%;accent-color:#cfd5df;margin:10px 0 1px}.range-labels{display:flex;justify-content:space-between;color:#677080;font-size:.72rem}.leverage-labels{position:relative;display:block;height:1rem}.leverage-labels span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}.hint{margin-top:7px;color:var(--muted);font-size:.8rem;line-height:1.55}.hint strong{color:#dce1e8}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}.buttons button{border:0;border-radius:999px;padding:10px;font-weight:900;cursor:pointer}.reset{background:#272b34;color:#e8ebf0}.calc{background:var(--blue);color:white}.result-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.result-head h2{font-size:1rem;margin:0}.pill{background:#262b34;padding:8px 10px;border-radius:8px;color:#dfe4eb;font-weight:800;font-size:.85rem}.metric{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end;padding:11px 0;border-bottom:1px solid #232730}.metric:last-of-type{border-bottom:0}.metric .k{color:var(--muted);font-size:.88rem}.metric .v{text-align:right;font-weight:900;font-variant-numeric:tabular-nums}.metric .sub{grid-column:2;color:#737b8a;font-size:.78rem;text-align:right;margin-top:-7px}.positive{color:var(--green)}.negative{color:var(--red)}.neutral{color:var(--text)}.divider{height:1px;background:#272c35;margin:14px 0}.formula{color:#858e9d;font-size:.78rem;line-height:1.6;margin-top:11px}.tiny{margin-top:10px;color:#6f7786;font-size:.72rem;line-height:1.5}@media(max-width:660px){body{padding:10px}.shell{grid-template-columns:1fr}.result-card{min-height:auto}}

/* Compact desktop input matrix: open/close above position/fee. */
.fee-labels{position:relative;display:block;height:1rem}
.fee-labels span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
.shell{grid-template-columns:repeat(2,minmax(0,1fr));align-items:stretch}
.input-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:12px;row-gap:14px;margin-top:14px}
.input-grid>.field{min-width:0;margin-top:0}
.input-grid .label{gap:5px;font-size:.84rem}
.input-grid .label span:last-child:not(:first-child){font-size:.76rem;white-space:nowrap}
.input-grid .input-wrap{min-height:42px}
.input-grid .fee-field .value-box{min-height:42px}
.input-grid .fee-field input[type="range"]{margin:9px 0 1px}
.input-grid .fee-field .range-labels{font-size:.64rem;letter-spacing:-.015em}
.input-grid .hint{font-size:.74rem;line-height:1.45;margin-top:7px}
.buttons{margin-top:17px}
.result-card{min-height:100%}
.metric .v,.metric .sub{overflow-wrap:anywhere}
@media(max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .result-card{min-height:auto}
}
@media(max-width:520px){
  .input-grid{grid-template-columns:minmax(0,1fr);gap:12px}
  .input-grid .fee-field .range-labels{font-size:.72rem}
  .input-grid .hint{font-size:.8rem}
}

/* Standalone four-function calculator inside the result card. */
.result-card{display:flex;flex-direction:column}
.fx-note{margin-top:11px;font-size:.76rem}
.mini-calculator{margin-top:auto;padding-top:10px;min-width:0}
.mini-calc-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--muted);font-weight:800;font-size:.82rem;margin-bottom:5px}
.mini-calc-expression{color:#737e8e;font-weight:500;font-size:.72rem;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-calc-display{display:block;width:100%;height:35px;padding:5px 11px;margin:0 0 6px;border:1px solid var(--border);border-radius:8px;background:var(--input);color:var(--text);text-align:right;font-weight:800;font-size:1.1rem;font-variant-numeric:tabular-nums;outline:none}
.mini-calc-display:focus{border-color:#4f7fff}
.mini-calc-keys{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:29px;gap:5px}
.mini-calc-keys button{min-width:0;padding:0;border:1px solid #323843;border-radius:7px;background:#242832;color:#e8ecf2;font:700 .87rem system-ui,-apple-system,"Segoe UI",sans-serif;cursor:pointer;touch-action:manipulation}
.mini-calc-keys button:active{background:#414b5c}
.mini-calc-keys .calc-function{color:#b9c5d4;background:#2d333d}
.mini-calc-keys .calc-operator{color:#b1caff;background:#293346}
.mini-calc-keys .calc-equals{grid-row:span 2;background:var(--blue);border-color:var(--blue);color:#fff;font-size:1.2rem}
.mini-calc-keys .calc-equals:active{background:#1c55ce}
@media(max-width:820px){.mini-calculator{margin-top:15px}}

/* Center the complete calculator in available viewport space while keeping overflow scrollable. */
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.app{margin:auto}

/* Theme toggle: dark theme above is left unchanged. */
.title-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.title-bar .title{margin:0}
.theme-toggle{flex:none;display:grid;place-items:center;width:36px;height:36px;padding:0;border:1px solid var(--border);border-radius:10px;background:var(--panel);color:var(--text);cursor:pointer}
.theme-toggle:hover{border-color:#687586}

.icon-moon{display:none}

/* Main PnL is the only animated monetary result. Original rest of UI is unchanged. */
#netPnl.pnl-profit{position:relative;display:inline-block;justify-self:end;max-width:100%;line-height:1.28;transform-origin:right center;overflow-wrap:anywhere;isolation:isolate}
#netPnl.pnl-profit-1{font-size:1.16rem}
#netPnl.pnl-profit-2{font-size:1.34rem}
#netPnl.pnl-profit-3{font-size:1.52rem}
#netPnl.pnl-profit-4{font-size:1.72rem}
#netPnl.pnl-profit-2{filter:drop-shadow(0 0 7px color-mix(in srgb,var(--green) 38%,transparent))}
#netPnl.pnl-profit-3{filter:drop-shadow(0 0 11px color-mix(in srgb,var(--green) 55%,transparent))}
#netPnl.pnl-profit-4{filter:drop-shadow(0 0 15px color-mix(in srgb,var(--green) 72%,transparent))}
#netPnl.pnl-profit-bloom{animation:pnl-profit-celebrate 1.25s cubic-bezier(.22,.75,.3,1) both}
#netPnl.pnl-profit-bloom.pnl-profit-1{animation-duration:.9s}
#netPnl.pnl-profit-bloom.pnl-profit-4{animation-duration:1.5s}
@keyframes pnl-profit-celebrate{
  0%{opacity:.5;transform:translateY(9px) scale(.84);filter:drop-shadow(0 0 0 transparent)}
  35%{opacity:1;transform:translateY(0) scale(1.055)}
  70%{transform:scale(1.11);filter:drop-shadow(0 0 19px color-mix(in srgb,var(--green) 80%,transparent))}
  85%{transform:scale(.98)}
  100%{opacity:1;transform:scale(1)}
}
#netPnl.pnl-profit-finish{animation:pnl-profit-finish .55s ease-out both}
@keyframes pnl-profit-finish{
  0%{transform:scale(1)}
  36%{transform:scale(1.16);text-shadow:0 0 20px color-mix(in srgb,var(--green) 78%,transparent)}
  68%{transform:scale(.975)}
  100%{transform:scale(1)}
}
@media(max-width:520px){
  #netPnl.pnl-profit-3{font-size:1.32rem}
  #netPnl.pnl-profit-4{font-size:1.44rem}
}
@media(prefers-reduced-motion:reduce){
  #netPnl.pnl-profit-bloom,#netPnl.pnl-profit-finish{animation:none}
}

<body>
<div class="app">
  <div class="title-bar">
    <div class="title">先物 損益計算</div>
    <button id="themeToggle" class="theme-toggle" type="button" aria-label="ライトモードに切り替え" title="ライトモードに切り替え">
      <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/>
      </svg>
      <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20.985 12.486a9 9 0 0 1-9.47-9.47A9 9 0 1 0 20.985 12.486Z"/>
      </svg>
    </button>
  </div>
  <div class="shell">
    <section class="card form-card">
      <div class="seg">
        <button id="longBtn" class="long active">ロング</button>
        <button id="shortBtn" class="short">ショート</button>
      </div>

      <div class="field">
        <div class="label"><span>レバレッジ</span><span>スライダー200x / 手入力1000x</span></div>
        <div class="lev-top">
          <button class="step" id="minusLev">−</button>
          <div class="value-box"><input id="leverageInput" type="number" inputmode="numeric" min="1" max="1000" step="1" value="10" aria-label="レバレッジ"><span class="unit">X</span></div>
          <button class="step" id="plusLev">＋</button>
        </div>
        <div class="preset-row"><button data-lev="10" class="on">10x</button><button data-lev="50">50x</button><button data-lev="100">100x</button><button data-lev="200">200x</button></div>
        <input id="leverage" type="range" min="1" max="200" step="1" value="10">
        <div class="range-labels leverage-labels"><span style="left:calc(0.0000% + 8.00px)">1x</span><span style="left:calc(24.6231% + 4.06px)">50x</span><span style="left:calc(49.7487% + 0.04px)">100x</span><span style="left:calc(74.8744% - 3.98px)">150x</span><span style="left:calc(100.0000% - 11.00px)">200x</span></div>
      </div>

      <div class="input-grid" aria-label="価格・ポジション・手数料の入力">
      <div class="field"><div class="label"><span>オープン価格</span></div><div class="input-wrap"><input id="openPrice" class="grouped-input" type="text" inputmode="decimal" value=""><span class="suffix">USDT</span></div></div>
      <div class="field"><div class="label"><span>決済価格</span></div><div class="input-wrap"><input id="closePrice" class="grouped-input" type="text" inputmode="decimal" value=""><span class="suffix">USDT</span></div></div>
      <div class="field"><div class="label"><span>ポジション価値</span><span>USDT建て</span></div><div class="input-wrap"><input id="positionValue" class="grouped-input" type="text" inputmode="decimal" value=""><span class="suffix">USDT</span></div><div class="hint">推定必要証拠金: <strong id="marginHint">—</strong></div></div>

      <div class="field fee-field">
        <div class="label"><span>手数料率</span><span>0〜0.1%</span></div>
        <div class="value-box"><input id="feeInput" type="number" inputmode="decimal" min="0" max="0.1" step="0.01" value="0" aria-label="手数料率"><span class="unit">%</span></div>
        <input id="feeRate" type="range" min="0" max="0.1" step="0.01" value="0">
        <div class="range-labels fee-labels"><span style="left:calc(0% + 8.0px)">0%</span><span style="left:calc(20% + 4.8px)">0.02%</span><span style="left:calc(40% + 1.6px)">0.04%</span><span style="left:calc(60% - 1.6px)">0.06%</span><span style="left:calc(80% - 4.8px)">0.08%</span><span style="left:calc(100% - 8.0px)">0.10%</span></div>
      </div>
      </div>

      <div class="buttons"><button class="reset" id="resetBtn">リセット</button><button class="calc" id="calcBtn">計算する</button></div>
    </section>

    <aside class="card result-card">
      <div class="result-head"><h2>計算結果</h2><div class="pill">USDT</div></div>
      <div class="metric"><div class="k">損益</div><div class="v neutral" id="netPnl">—</div><div class="sub" id="jpyPnl">—</div></div>
      <div class="metric"><div class="k">ROI</div><div class="v neutral" id="roi">—</div></div>
      <div class="metric"><div class="k">手数料</div><div class="v" id="fees">—</div><div class="sub" id="feeJpy">—</div></div>
      <div class="formula fx-note">※ 1ドル＝158円として計算します。</div>
      <section class="mini-calculator" aria-label="簡易電卓">
        <div class="mini-calc-heading">
          <span>電卓</span>
          <span class="mini-calc-expression" id="miniCalcExpression" aria-hidden="true"></span>
        </div>

        <div class="mini-calc-keys" id="miniCalcKeys">
          <button type="button" data-calc="clear" class="calc-function" aria-label="すべてクリア">AC</button>
          <button type="button" data-calc="backspace" class="calc-function" aria-label="一文字消す">⌫</button>
          <button type="button" data-calc="divide" class="calc-operator">÷</button>

          <button type="button" data-calc="7">7</button>
          <button type="button" data-calc="8">8</button>
          <button type="button" data-calc="9">9</button>
          <button type="button" data-calc="subtract" class="calc-operator">−</button>
          <button type="button" data-calc="4">4</button>

          <button type="button" data-calc="6">6</button>

          <button type="button" data-calc="2">2</button>
          <button type="button" data-calc="3">3</button>

          <button type="button" data-calc="sign" aria-label="プラスとマイナスを切り替え">±</button>
          <button type="button" data-calc="0">0</button>
          <button type="button" data-calc="decimal">.</button>
        </div>
      </section>
    </aside>
  </div>
</div>

<script>
(() => {
  'use strict';
  const $=id=>document.getElementById(id);

  const e={
    long:$('longBtn'),short:$('shortBtn'),
    lev:$('leverage'),levInput:$('leverageInput'),
    open:$('openPrice'),close:$('closePrice'),pos:$('positionValue'),
    fee:$('feeRate'),feeInput:$('feeInput'),
    marginHint:$('marginHint'),
    net:$('netPnl'),jpy:$('jpyPnl'),roi:$('roi'),fees:$('fees'),feeJpy:$('feeJpy')
  };

  let side='long';
  let hasCalculated=false;
  let lastCalculated=null;
  const D={side:'long',leverage:10,open:'',close:'',pos:'',fee:0};
  const JPY_PER_USDT=158n;

  // Arbitrary-precision decimal arithmetic using BigInt rational numbers.
  // This avoids JavaScript Number precision loss for very large inputs.
  const clean=s=>String(s).replace(/,/g,'').trim();

  function dec(s){
    const v=clean(s);
    if(!/^\d+(?:\.\d+)?$/.test(v)) return null;
    const parts=v.split('.');
    const whole=parts[0]||'0';
    const frac=parts[1]||'';
    const digits=(whole+frac).replace(/^0+(?=\d)/,'')||'0';
    return {n:BigInt(digits),d:10n**BigInt(frac.length)};
  }
  const rat=(n,d=1n)=>({n,d});
  const add=(a,b)=>rat(a.n*b.d+b.n*a.d,a.d*b.d);
  const sub=(a,b)=>rat(a.n*b.d-b.n*a.d,a.d*b.d);
  const mul=(a,b)=>rat(a.n*b.n,a.d*b.d);
  const div=(a,b)=>rat(a.n*b.d,a.d*b.n);
  const mulInt=(a,k)=>rat(a.n*k,a.d);
  const absRat=a=>rat(a.n<0n?-a.n:a.n,a.d);
  const isPositive=a=>!!a&&a.d!==0n&&a.n>0n;

  function ratFixed(a,places=2){
    if(!a||a.d===0n) return '—';
    const neg=a.n<0n;
    const num=neg?-a.n:a.n;
    const scale=10n**BigInt(places);
    const scaled=num*scale;
    let q=scaled/a.d;
    const rem=scaled%a.d;
    if(rem*2n>=a.d) q+=1n;

    let s=q.toString();
    if(places>0){
      s=s.padStart(places+1,'0');
      const i=s.slice(0,-places);
      const f=s.slice(-places);
      s=i.replace(/\B(?=(\d{3})+(?!\d))/g,',')+'.'+f;
    }else{
      s=s.replace(/\B(?=(\d{3})+(?!\d))/g,',');
    }
    return (neg?'-':'')+s;
  }

  function fmtPct(a){
    if(!a||a.d===0n) return '—';
    return (a.n>0n?'+':'')+ratFixed(a,0)+'%';
  }

  function fmtJpy(a){
    if(!a||a.d===0n) return '—';
    const neg=a.n<0n;
    return (neg?'-¥':'¥')+ratFixed(absRat(a),0);
  }

  function formatGroupedInput(el){
    const oldValue=el.value;
    const caret=el.selectionStart??oldValue.length;
    const logicalPos=oldValue.slice(0,caret).replace(/,/g,'').length;

    let raw=oldValue.replace(/,/g,'').replace(/[^0-9.]/g,'');
    const firstDot=raw.indexOf('.');
    if(firstDot!==-1){
      raw=raw.slice(0,firstDot+1)+raw.slice(firstDot+1).replace(/\./g,'');
    }

    if(raw===''){
      el.value='';
      dirty();
      return;
    }

    let [intPart,fracPart]=raw.split('.');
    if(intPart==='') intPart='0';
    intPart=intPart.replace(/^0+(?=\d)/,'');
    const grouped=intPart.replace(/\B(?=(\d{3})+(?!\d))/g,',');
    el.value=fracPart!==undefined?`${grouped}.${fracPart}`:grouped;

    let seen=0,newCaret=el.value.length;
    for(let i=0;i<el.value.length;i++){
      if(el.value[i]!==',') seen++;
      if(seen>=logicalPos){newCaret=i+1;break;}
    }
    try{el.setSelectionRange(newCaret,newCaret)}catch(_){}
    dirty();
  }

  function signedRat(el,v){
    el.classList.remove('positive','negative','neutral');
    el.classList.add(v&&v.n>0n?'positive':v&&v.n<0n?'negative':'neutral');
  }

  function vals(){
    const levNum=Math.round(Number(e.levInput.value));
    return{
      leverage:Number.isFinite(levNum)?BigInt(levNum):0n,
      open:dec(e.open.value),
      close:dec(e.close.value),
      pos:dec(e.pos.value),
      feePct:dec(e.feeInput.value)
    };
  }

  let pnlCountFrame=0;
  let pnlFinishTimer=0;

  function stopPnlCount(){
    if(pnlCountFrame) cancelAnimationFrame(pnlCountFrame);
    pnlCountFrame=0;
    if(pnlFinishTimer) clearTimeout(pnlFinishTimer);
    pnlFinishTimer=0;
  }

  // Animate the visible rounded USDT amount only. Exact BigInt calculations
  // and all other financial results remain untouched.
  function animatePnlAmount(gross){
    stopPnlCount();
    const finalText=`${ratFixed(gross,0)} USDT`;
    const rounded=BigInt(ratFixed(gross,0).replace(/,/g,''));
    if(window.matchMedia('(prefers-reduced-motion: reduce)').matches || rounded===0n){
      e.net.textContent=finalText;
      return;
    }

    const duration=gross.n>0n?1250:1000;
    let started=null;
    const tick=timestamp=>{
      if(started===null) started=timestamp;
      const t=Math.min(1,(timestamp-started)/duration);
      const eased=1-Math.pow(1-t,3);
      const million=BigInt(Math.round(eased*1000000));
      const value=rounded*million/1000000n;
      e.net.textContent=`${value.toLocaleString('en-US')} USDT`;
      if(t<1){
        pnlCountFrame=requestAnimationFrame(tick);
      }else{
        pnlCountFrame=0;
        e.net.textContent=finalText;
        if(gross.n>0n){
          e.net.classList.remove('pnl-profit-bloom');
          void e.net.offsetWidth;
          e.net.classList.add('pnl-profit-finish');
          pnlFinishTimer=setTimeout(()=>e.net.classList.remove('pnl-profit-finish'),560);
        }
      }
    };
    e.net.textContent='0 USDT';
    pnlCountFrame=requestAnimationFrame(tick);
  }

  function clearProfitEmphasis(){
    e.net.classList.remove('pnl-profit','pnl-profit-1','pnl-profit-2','pnl-profit-3','pnl-profit-4','pnl-profit-bloom','pnl-profit-finish');
  }

  function applyProfitEmphasis(gross){
    clearProfitEmphasis();
    if(!gross || gross.n<=0n) return;
    // Thresholds are in USDT and use the existing exact rational representation.
    const level=gross.n>=10000n*gross.d?4:
      gross.n>=1000n*gross.d?3:
      gross.n>=100n*gross.d?2:1;
    e.net.classList.add('pnl-profit',`pnl-profit-${level}`);
    // Restart the stronger profit-only effect when Calculate is pressed.
    void e.net.offsetWidth;
    e.net.classList.add('pnl-profit-bloom');
  }

  function clearResults(){
    stopPnlCount();
    clearProfitEmphasis();
    [e.net,e.jpy,e.roi,e.fees,e.feeJpy].forEach(x=>x.textContent='—');
    [e.net,e.roi].forEach(x=>{x.classList.remove('positive','negative');x.classList.add('neutral')});
  }

  function updateMarginHint(){
    const p=dec(e.pos.value);
    const lev=Math.round(Number(e.levInput.value));
    if(isPositive(p)&&Number.isFinite(lev)&&lev>0){
      const margin=div(p,rat(BigInt(lev)));
      e.marginHint.textContent=`${ratFixed(margin,2)} USDT`;
    }else{
      e.marginHint.textContent='—';
    }
  }

  function dirty(){
    updateMarginHint();
  }

  function setSide(s){
    side=s;
    e.long.classList.toggle('active',s==='long');
    e.short.classList.toggle('active',s==='short');
  }

  function setLev(v){
    v=Math.max(1,Math.min(200,Math.round(Number(v)||1)));
    e.lev.value=v;
    e.levInput.value=v;
    document.querySelectorAll('[data-lev]').forEach(b=>b.classList.toggle('on',Number(b.dataset.lev)===v));
    dirty();
  }

  // Direct typing allows up to 1000x; the slider remains capped at 200x.
  function syncLevInput(){
    const raw=e.levInput.value;
    if(raw===''){dirty();return}
    const v=Math.round(Number(raw));
    if(Number.isFinite(v)&&v>=1&&v<=1000){
      e.lev.value=Math.min(v,200);
      document.querySelectorAll('[data-lev]').forEach(b=>b.classList.toggle('on',Number(b.dataset.lev)===v));
    }
    dirty();
  }

  function commitLevInput(){
    const value=Number(e.levInput.value);
    const v=Number.isFinite(value)&&value>0
      ? Math.max(1,Math.min(1000,Math.round(value)))
      : D.leverage;
    e.levInput.value=v;
    syncLevInput();
  }

  function stepLev(delta){
    const current=Number(e.levInput.value);
    // +/- cannot exceed 200x unless a higher value was typed first.
    if(Number.isFinite(current)&&current>200){
      e.levInput.value=Math.max(1,Math.min(1000,Math.round(current)+delta));
      syncLevInput();
    }else{
      setLev(current+delta);
    }
  }

  function setFee(v){
    v=Math.max(0,Math.min(0.1,Math.round((Number(v)||0)*100)/100));
    e.fee.value=v;
    e.feeInput.value=v.toFixed(2).replace(/\.00$/,'').replace(/(\.\d)0$/,'$1');
    dirty();
  }

  function syncFeeInput(){
    const raw=e.feeInput.value;
    if(raw===''){return}
    const v=Number(raw);
    if(Number.isFinite(v)&&v>=0&&v<=0.1){
      e.fee.value=Math.round(v*100)/100;
      dirty();
    }
  }

  function valid(v){
    return isPositive(v.open)&&isPositive(v.close)&&isPositive(v.pos)&&
      v.leverage>=1n&&v.leverage<=1000n&&
      v.feePct&&v.feePct.n>=0n&&v.feePct.n*10n<=v.feePct.d;
  }

  function renderCalculation(v){
    const delta=side==='long'?sub(v.close,v.open):sub(v.open,v.close);
    const gross=div(mul(v.pos,delta),v.open);

    const closeNotional=div(mul(v.pos,v.close),v.open);
    const feeRate=div(v.feePct,rat(100n));
    const totalFees=mul(add(v.pos,closeNotional),feeRate);

    const margin=div(v.pos,rat(v.leverage));
    const roi=mulInt(div(gross,margin),100n);

    animatePnlAmount(gross);
    e.jpy.textContent=`≈ ${fmtJpy(mulInt(gross,JPY_PER_USDT))}`;
    e.roi.textContent=fmtPct(roi);
    e.fees.textContent=`${ratFixed(totalFees,0)} USDT`;
    e.feeJpy.textContent=`≈ ${fmtJpy(mulInt(totalFees,JPY_PER_USDT))}`;

    signedRat(e.net,gross);
    applyProfitEmphasis(gross);
    signedRat(e.roi,roi);
  }

  function calc(){
    const v=vals();
    updateMarginHint();
    if(!valid(v)) return;

    lastCalculated=v;
    hasCalculated=true;
    renderCalculation(lastCalculated);
  }

  function load(){
    side=D.side;
    e.open.value=D.open;
    e.close.value=D.close;
    e.pos.value=D.pos;
    e.lev.value=D.leverage;
    e.levInput.value=D.leverage;
    e.fee.value=D.fee;
    e.feeInput.value=D.fee;
    hasCalculated=false;
    lastCalculated=null;
  }

  function reset(){
    load();
    e.long.classList.add('active');
    e.short.classList.remove('active');
    document.querySelectorAll('[data-lev]').forEach(b=>b.classList.toggle('on',Number(b.dataset.lev)===D.leverage));
    updateMarginHint();
    clearResults();
  }

  e.long.addEventListener('click',()=>setSide('long'));
  e.short.addEventListener('click',()=>setSide('short'));
  $('minusLev').addEventListener('click',()=>stepLev(-1));
  $('plusLev').addEventListener('click',()=>stepLev(1));
  e.lev.addEventListener('input',x=>setLev(x.target.value));
  e.levInput.addEventListener('input',syncLevInput);
  e.levInput.addEventListener('blur',commitLevInput);
  e.levInput.addEventListener('keydown',x=>{if(x.key==='Enter')e.levInput.blur()});
  document.querySelectorAll('[data-lev]').forEach(b=>b.addEventListener('click',()=>setLev(b.dataset.lev)));

  e.fee.addEventListener('input',x=>setFee(x.target.value));
  e.feeInput.addEventListener('input',syncFeeInput);
  e.feeInput.addEventListener('blur',()=>setFee(e.feeInput.value||0));
  e.feeInput.addEventListener('keydown',x=>{if(x.key==='Enter')e.feeInput.blur()});

  [e.open,e.close,e.pos].forEach(x=>x.addEventListener('input',()=>formatGroupedInput(x)));
  $('calcBtn').addEventListener('click',calc);
  $('resetBtn').addEventListener('click',reset);

  load();
  e.long.classList.toggle('active',side==='long');
  e.short.classList.toggle('active',side==='short');
  document.querySelectorAll('[data-lev]').forEach(b=>b.classList.toggle('on',Number(b.dataset.lev)===Number(e.levInput.value)));
  updateMarginHint();
  clearResults();
})();
</script>

<script>
(() => {
  'use strict';

  // This calculator is fully independent of the futures inputs and Reset button.
  const display=document.getElementById('miniCalcDisplay');
  const expression=document.getElementById('miniCalcExpression');
  const keys=document.getElementById('miniCalcKeys');
  const symbol={add:'＋',subtract:'−',multiply:'×',divide:'÷'};
  const state={value:'0',left:null,operator:null,replaceNext:false};

  function shown(value) {
    if(value==='エラー') return value;
    const neg=value.startsWith('-')?'-':'';
    const text=neg?value.slice(1):value;
    if(/e/i.test(text)) return value;
    const parts=text.split('.');
    const integer=parts[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');
    return neg+integer+(parts.length>1?'.'+parts[1]:'');
  }

  function render() {
    display.value=shown(state.value);
    display.scrollLeft=display.scrollWidth;
    expression.textContent=state.operator&&state.left!==null
      ? shown(String(state.left))+' '+symbol[state.operator]
      : '';
  }

  function clear() {
    state.value='0';
    state.left=null;
    state.operator=null;
    state.replaceNext=false;
    render();
  }

  function digit(char) {
    if(state.value==='エラー') clear();
    if(state.replaceNext){state.value='0';state.replaceNext=false;}
    const count=state.value.replace(/[^0-9]/g,'').length;
    if(count>=15) return;
    state.value=state.value==='0'?char:state.value==='-0'?'-'+char:state.value+char;
    render();
  }

  function decimal() {
    if(state.value==='エラー') clear();
    if(state.replaceNext){state.value='0';state.replaceNext=false;}
    if(!state.value.includes('.')) state.value+='.';
    render();
  }

  function backspace() {
    if(state.value==='エラー'){clear();return;}
    if(state.replaceNext){state.value='0';state.replaceNext=false;render();return;}
    const value=state.value.slice(0,-1);
    state.value=(!value||value==='-')?'0':value;
    render();
  }

  function sign() {
    if(state.value==='エラー') return;
    if(Number(state.value)===0) return;
    state.value=state.value.startsWith('-')?state.value.slice(1):'-'+state.value;
    render();
  }

  function compute(a,op,b) {
    let result;
    if(op==='add') result=a+b;
    else if(op==='subtract') result=a-b;
    else if(op==='multiply') result=a*b;
    else if(op==='divide') result=b===0?NaN:a/b;
    if(!Number.isFinite(result)) return null;
    // Remove floating-point artifacts such as 0.30000000000000004.
    return Number(result.toPrecision(12)).toString();
  }

  function operate(op) {
    if(state.value==='エラー') return;
    const current=Number(state.value);
    if(state.operator&&!state.replaceNext){
      const result=compute(state.left,state.operator,current);
      if(result===null){
        state.value='エラー';state.left=null;state.operator=null;state.replaceNext=true;render();return;
      }
      state.value=result;
    }
    state.left=Number(state.value);
    state.operator=op;
    state.replaceNext=true;
    render();
  }

  function equals() {
    if(!state.operator||state.replaceNext) return;
    const result=compute(state.left,state.operator,Number(state.value));
    state.value=result===null?'エラー':result;
    state.left=null;
    state.operator=null;
    state.replaceNext=true;
    render();
  }

  function handle(action) {
    if(/^[0-9]$/.test(action)) digit(action);
    else if(action==='decimal') decimal();
    else if(action==='clear') clear();
    else if(action==='backspace') backspace();
    else if(action==='sign') sign();
    else if(action==='equals') equals();
    else if(symbol[action]) operate(action);
  }

  keys.addEventListener('click',e=>{
    const button=e.target.closest('button[data-calc]');
    if(!button||!keys.contains(button)) return;
    handle(button.dataset.calc);
  });

  display.addEventListener('keydown',e=>{
    const operators={'+':'add','-':'subtract','*':'multiply','/':'divide','x':'multiply','X':'multiply'};
    let action=null;
    if(/^[0-9]$/.test(e.key)) action=e.key;
    else if(e.key==='.') action='decimal';
    else if(e.key==='Enter'||e.key==='=') action='equals';
    else if(e.key==='Backspace') action='backspace';
    else if(e.key==='Escape'||e.key==='Delete') action='clear';
    else if(operators[e.key]) action=operators[e.key];
    if(action){e.preventDefault();handle(action);}
  });

  render();
})();
</script>
<script>
(() => {
  'use strict';
  const toggle = document.getElementById('themeToggle');
  const meta = document.querySelector('meta[name="theme-color"]');

  function refreshThemeButton() {
    const light = document.documentElement.dataset.theme === 'light';
    const name = light ? 'ダークモードに切り替え' : 'ライトモードに切り替え';
    toggle.setAttribute('aria-label', name);
    toggle.title = name;
    meta.content = light ? '#f3f6fa' : '#101216';
  }

  toggle.addEventListener('click', () => {
    const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem('pnl-calculator-theme', next); } catch (_) {}
    refreshThemeButton();
  });

  refreshThemeButton();
})();
</script>
