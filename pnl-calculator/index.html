<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101216">
<title>先物 損益計算</title>
<style>
:root{--bg:#101216;--panel:#16171A;--input:#242832;--border:#2b303a;--text:#f1f3f6;--muted:#8f97a6;--blue:#2b6dff;--green:#14c78e;--red:#ff4d68;--shadow:0 18px 50px rgba(0,0,0,.28)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;padding:20px}button,input{font:inherit}.app{width:min(980px,100%);margin:0 auto}.title{margin:0 0 14px;font-size:1.08rem;font-weight:800;letter-spacing:.02em}.shell{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,.82fr);gap:16px}.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow)}.form-card{padding:16px}.result-card{padding:18px;min-height:100%}.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:#20242c;padding:4px;border-radius:11px;margin-bottom:16px}.seg button{border:0;color:var(--muted);background:transparent;border-radius:8px;padding:11px 12px;font-weight:800;cursor:pointer}.seg button.active.long{background:var(--green);color:#071b14}.seg button.active.short{background:var(--red);color:#fff}.field{margin-top:14px}.label{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:7px;color:var(--muted);font-size:.88rem}.input-wrap{display:flex;align-items:center;gap:9px;background:var(--input);border:1px solid transparent;border-radius:10px;padding:0 12px;min-height:44px}.input-wrap:focus-within{border-color:#4f7fff}input[type="number"],.grouped-input{width:100%;border:0;outline:0;background:transparent;color:var(--text);text-align:right;font-weight:800;font-size:1rem;min-width:0}input[type="number"]{appearance:textfield;-moz-appearance:textfield}input[type="number"]::-webkit-outer-spin-button,input[type="number"]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}.suffix{color:var(--muted);font-size:.88rem;white-space:nowrap}.lev-top{display:flex;align-items:center;gap:10px}.step{width:38px;height:38px;border:0;border-radius:9px;background:#2b303a;color:#c7ccd5;font-size:1.35rem;cursor:pointer}.value-box{flex:1;display:flex;align-items:center;justify-content:center;gap:2px;background:var(--input);border:1px solid transparent;border-radius:10px;padding:0 10px;font-weight:900}.value-box:focus-within{border-color:#4f7fff}.value-box input[type="number"]{width:4ch;padding:10px 0;text-align:right;font-weight:900;font-size:1rem}.value-box .unit{margin-left:1px}.unit{color:var(--text);font-weight:900}.preset-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}.preset-row button{border:0;border-radius:7px;background:#2a2e36;color:#aeb5c2;padding:6px 4px;cursor:pointer}.preset-row button.on{color:#fff;background:#3b4250}input[type="range"]{width:100%;accent-color:#cfd5df;margin:13px 0 2px}.range-labels{display:flex;justify-content:space-between;color:#677080;font-size:.72rem}.hint{margin-top:10px;color:var(--muted);font-size:.8rem;line-height:1.55}.hint strong{color:#dce1e8}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.buttons button{border:0;border-radius:999px;padding:12px;font-weight:900;cursor:pointer}.reset{background:#272b34;color:#e8ebf0}.calc{background:var(--blue);color:white}.result-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.result-head h2{font-size:1rem;margin:0}.pill{background:#262b34;padding:8px 10px;border-radius:8px;color:#dfe4eb;font-weight:800;font-size:.85rem}.metric{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end;padding:14px 0;border-bottom:1px solid #232730}.metric:last-of-type{border-bottom:0}.metric .k{color:var(--muted);font-size:.88rem}.metric .v{text-align:right;font-weight:900;font-variant-numeric:tabular-nums}.metric .sub{grid-column:2;color:#737b8a;font-size:.78rem;text-align:right;margin-top:-7px}.positive{color:var(--green)}.negative{color:var(--red)}.neutral{color:var(--text)}.divider{height:1px;background:#272c35;margin:14px 0}.formula{color:#858e9d;font-size:.78rem;line-height:1.6;margin-top:14px}.tiny{margin-top:14px;color:#6f7786;font-size:.72rem;line-height:1.5}@media(max-width:760px){body{padding:10px}.shell{grid-template-columns:1fr}.result-card{min-height:auto}}
</style>
</head>
<body>
<div class="app">
  <div class="title">先物 損益計算</div>
  <div class="shell">
    <section class="card form-card">
      <div class="seg">
        <button id="longBtn" class="long active">ロング</button>
        <button id="shortBtn" class="short">ショート</button>
      </div>

      <div class="field">
        <div class="label"><span>レバレッジ</span><span>1x〜300x</span></div>
        <div class="lev-top">
          <button class="step" id="minusLev">−</button>
          <div class="value-box"><input id="leverageInput" type="number" inputmode="numeric" min="1" max="300" step="1" value="10" aria-label="レバレッジ"><span class="unit">X</span></div>
          <button class="step" id="plusLev">＋</button>
        </div>
        <div class="preset-row"><button data-lev="10" class="on">10x</button><button data-lev="50">50x</button><button data-lev="100">100x</button><button data-lev="300">300x</button></div>
        <input id="leverage" type="range" min="1" max="300" step="1" value="10">
        <div class="range-labels"><span>1x</span><span>50x</span><span>100x</span><span>150x</span><span>200x</span><span>250x</span><span>300x</span></div>
      </div>

      <div class="field"><div class="label"><span>オープン価格</span></div><div class="input-wrap"><input id="openPrice" class="grouped-input" type="text" inputmode="decimal" value=""><span class="suffix">USDT</span></div></div>
      <div class="field"><div class="label"><span>決済価格</span></div><div class="input-wrap"><input id="closePrice" class="grouped-input" type="text" inputmode="decimal" value=""><span class="suffix">USDT</span></div></div>
      <div class="field"><div class="label"><span>ポジション価値</span><span>USDT建て</span></div><div class="input-wrap"><input id="positionValue" class="grouped-input" type="text" inputmode="decimal" value=""><span class="suffix">USDT</span></div><div class="hint">推定必要証拠金: <strong id="marginHint">—</strong></div></div>

      <div class="field">
        <div class="label"><span>手数料率</span><span>0〜0.1%</span></div>
        <div class="value-box"><input id="feeInput" type="number" inputmode="decimal" min="0" max="0.1" step="0.01" value="0" aria-label="手数料率"><span class="unit">%</span></div>
        <input id="feeRate" type="range" min="0" max="0.1" step="0.01" value="0">
        <div class="range-labels"><span>0%</span><span>0.02%</span><span>0.04%</span><span>0.06%</span><span>0.08%</span><span>0.10%</span></div>
      </div>

      <div class="buttons"><button class="reset" id="resetBtn">リセット</button><button class="calc" id="calcBtn">計算する</button></div>
    </section>

    <aside class="card result-card">
      <div class="result-head"><h2>計算結果</h2><div class="pill">USDT</div></div>
      <div class="metric"><div class="k">損益</div><div class="v neutral" id="netPnl">—</div><div class="sub" id="jpyPnl">—</div></div>
      <div class="metric"><div class="k">ROI</div><div class="v neutral" id="roi">—</div></div>
      <div class="metric"><div class="k">手数料</div><div class="v" id="fees">—</div><div class="sub" id="feeJpy">—</div></div>
      <div class="formula">USDT建てリニア先物の簡易計算です。損益のJPY換算は 1 USDT = 158円 として計算します。</div>
      <div class="tiny">参考値です。資金調達料、スリッページ、維持証拠金、段階別手数料、清算条件などは含みません。</div>
    </aside>
  </div>
</div>

<script>
(() => {
  'use strict';
  const $=id=>document.getElementById(id);
  const e={
    long:$('longBtn'),short:$('shortBtn'),
    lev:$('leverage'),levInput:$('leverageInput'),
    open:$('openPrice'),close:$('closePrice'),pos:$('positionValue'),
    fee:$('feeRate'),feeInput:$('feeInput'),
    marginHint:$('marginHint'),
    net:$('netPnl'),jpy:$('jpyPnl'),roi:$('roi'),fees:$('fees'),feeJpy:$('feeJpy')
  };

  let side='long';
  let hasCalculated=false;
  const D={side:'long',leverage:10,open:'',close:'',pos:'',fee:0};
  const JPY_PER_USDT=158n;

  // Arbitrary-precision decimal arithmetic using BigInt rational numbers.
  // This avoids JavaScript Number precision loss for very large inputs.
  const clean=s=>String(s).replace(/,/g,'').trim();

  function dec(s){
    const v=clean(s);
    if(!/^\d+(?:\.\d+)?$/.test(v)) return null;
    const parts=v.split('.');
    const whole=parts[0]||'0';
    const frac=parts[1]||'';
    const digits=(whole+frac).replace(/^0+(?=\d)/,'')||'0';
    return {n:BigInt(digits),d:10n**BigInt(frac.length)};
  }
  const rat=(n,d=1n)=>({n,d});
  const add=(a,b)=>rat(a.n*b.d+b.n*a.d,a.d*b.d);
  const sub=(a,b)=>rat(a.n*b.d-b.n*a.d,a.d*b.d);
  const mul=(a,b)=>rat(a.n*b.n,a.d*b.d);
  const div=(a,b)=>rat(a.n*b.d,a.d*b.n);
  const mulInt=(a,k)=>rat(a.n*k,a.d);
  const absRat=a=>rat(a.n<0n?-a.n:a.n,a.d);
  const isPositive=a=>!!a&&a.d!==0n&&a.n>0n;

  function ratFixed(a,places=2){
    if(!a||a.d===0n) return '—';
    const neg=a.n<0n;
    const num=neg?-a.n:a.n;
    const scale=10n**BigInt(places);
    const scaled=num*scale;
    let q=scaled/a.d;
    const rem=scaled%a.d;
    if(rem*2n>=a.d) q+=1n;

    let s=q.toString();
    if(places>0){
      s=s.padStart(places+1,'0');
      const i=s.slice(0,-places);
      const f=s.slice(-places);
      s=i.replace(/\B(?=(\d{3})+(?!\d))/g,',')+'.'+f;
    }else{
      s=s.replace(/\B(?=(\d{3})+(?!\d))/g,',');
    }
    return (neg?'-':'')+s;
  }

  function fmtPct(a){
    if(!a||a.d===0n) return '—';
    return (a.n>0n?'+':'')+ratFixed(a,0)+'%';
  }

  function fmtJpy(a){
    if(!a||a.d===0n) return '—';
    const neg=a.n<0n;
    return (neg?'-¥':'¥')+ratFixed(absRat(a),0);
  }

  function formatGroupedInput(el){
    const oldValue=el.value;
    const caret=el.selectionStart??oldValue.length;
    const logicalPos=oldValue.slice(0,caret).replace(/,/g,'').length;

    let raw=oldValue.replace(/,/g,'').replace(/[^0-9.]/g,'');
    const firstDot=raw.indexOf('.');
    if(firstDot!==-1){
      raw=raw.slice(0,firstDot+1)+raw.slice(firstDot+1).replace(/\./g,'');
    }

    if(raw===''){
      el.value='';
      dirty();
      return;
    }

    let [intPart,fracPart]=raw.split('.');
    if(intPart==='') intPart='0';
    intPart=intPart.replace(/^0+(?=\d)/,'');
    const grouped=intPart.replace(/\B(?=(\d{3})+(?!\d))/g,',');
    el.value=fracPart!==undefined?`${grouped}.${fracPart}`:grouped;

    let seen=0,newCaret=el.value.length;
    for(let i=0;i<el.value.length;i++){
      if(el.value[i]!==',') seen++;
      if(seen>=logicalPos){newCaret=i+1;break;}
    }
    try{el.setSelectionRange(newCaret,newCaret)}catch(_){}
    dirty();
  }

  function signedRat(el,v){
    el.classList.remove('positive','negative','neutral');
    el.classList.add(v&&v.n>0n?'positive':v&&v.n<0n?'negative':'neutral');
  }

  function vals(){
    const levNum=Math.round(Number(e.levInput.value));
    return{
      leverage:Number.isFinite(levNum)?BigInt(levNum):0n,
      open:dec(e.open.value),
      close:dec(e.close.value),
      pos:dec(e.pos.value),
      feePct:dec(e.feeInput.value)
    };
  }

  function clearResults(){
    [e.net,e.jpy,e.roi,e.fees,e.feeJpy].forEach(x=>x.textContent='—');
    [e.net,e.roi].forEach(x=>{x.classList.remove('positive','negative');x.classList.add('neutral')});
  }

  function updateMarginHint(){
    const p=dec(e.pos.value);
    const lev=Math.round(Number(e.levInput.value));
    if(isPositive(p)&&Number.isFinite(lev)&&lev>0){
      const margin=div(p,rat(BigInt(lev)));
      e.marginHint.textContent=`${ratFixed(margin,2)} USDT`;
    }else{
      e.marginHint.textContent='—';
    }
  }

  function dirty(){
    updateMarginHint();
    hasCalculated=false;
    clearResults();
  }

  function setSide(s){
    side=s;
    e.long.classList.toggle('active',s==='long');
    e.short.classList.toggle('active',s==='short');
    if(hasCalculated) calc();
  }

  function setLev(v){
    v=Math.max(1,Math.min(300,Math.round(Number(v)||1)));
    e.lev.value=v;
    e.levInput.value=v;
    document.querySelectorAll('[data-lev]').forEach(b=>b.classList.toggle('on',Number(b.dataset.lev)===v));
    dirty();
  }

  function syncLevInput(){
    const raw=e.levInput.value;
    if(raw===''){hasCalculated=false;clearResults();return}
    const v=Math.round(Number(raw));
    if(Number.isFinite(v)&&v>=1&&v<=300){
      e.lev.value=v;
      document.querySelectorAll('[data-lev]').forEach(b=>b.classList.toggle('on',Number(b.dataset.lev)===v));
      dirty();
    }
  }

  function setFee(v){
    v=Math.max(0,Math.min(0.1,Math.round((Number(v)||0)*100)/100));
    e.fee.value=v;
    e.feeInput.value=v.toFixed(2).replace(/\.00$/,'').replace(/(\.\d)0$/,'$1');
    dirty();
  }

  function syncFeeInput(){
    const raw=e.feeInput.value;
    if(raw===''){hasCalculated=false;clearResults();return}
    const v=Number(raw);
    if(Number.isFinite(v)&&v>=0&&v<=0.1){
      e.fee.value=Math.round(v*100)/100;
      dirty();
    }
  }

  function valid(v){
    return isPositive(v.open)&&isPositive(v.close)&&isPositive(v.pos)&&
      v.leverage>=1n&&v.leverage<=300n&&
      v.feePct&&v.feePct.n>=0n&&v.feePct.n*10n<=v.feePct.d;
  }

  function calc(){
    const v=vals();
    updateMarginHint();
    if(!valid(v)){hasCalculated=false;clearResults();return}

    // Position value is entry notional in USDT.
    // PnL = positionValue × directional price change / entryPrice.
    const delta=side==='long'?sub(v.close,v.open):sub(v.open,v.close);
    const gross=div(mul(v.pos,delta),v.open);

    // Fee is charged on entry notional and estimated exit notional.
    const closeNotional=div(mul(v.pos,v.close),v.open);
    const feeRate=div(v.feePct,rat(100n));
    const totalFees=mul(add(v.pos,closeNotional),feeRate);

    const margin=div(v.pos,rat(v.leverage));
    const roi=mulInt(div(gross,margin),100n);

    e.net.textContent=`${ratFixed(gross,0)} USDT`;
    e.jpy.textContent=`≈ ${fmtJpy(mulInt(gross,JPY_PER_USDT))}`;
    e.roi.textContent=fmtPct(roi);
    e.fees.textContent=`${ratFixed(totalFees,0)} USDT`;
    e.feeJpy.textContent=`≈ ${fmtJpy(mulInt(totalFees,JPY_PER_USDT))}`;

    signedRat(e.net,gross);
    signedRat(e.roi,roi);
    hasCalculated=true;
  }

  function load(){
    side=D.side;
    e.open.value=D.open;
    e.close.value=D.close;
    e.pos.value=D.pos;
    e.lev.value=D.leverage;
    e.levInput.value=D.leverage;
    e.fee.value=D.fee;
    e.feeInput.value=D.fee;
    hasCalculated=false;
  }

  function reset(){
    load();
    e.long.classList.add('active');
    e.short.classList.remove('active');
    document.querySelectorAll('[data-lev]').forEach(b=>b.classList.toggle('on',Number(b.dataset.lev)===D.leverage));
    updateMarginHint();
    clearResults();
  }

  e.long.addEventListener('click',()=>setSide('long'));
  e.short.addEventListener('click',()=>setSide('short'));
  $('minusLev').addEventListener('click',()=>setLev(Number(e.levInput.value)-1));
  $('plusLev').addEventListener('click',()=>setLev(Number(e.levInput.value)+1));
  e.lev.addEventListener('input',x=>setLev(x.target.value));
  e.levInput.addEventListener('input',syncLevInput);
  e.levInput.addEventListener('blur',()=>setLev(e.levInput.value||D.leverage));
  e.levInput.addEventListener('keydown',x=>{if(x.key==='Enter')e.levInput.blur()});
  document.querySelectorAll('[data-lev]').forEach(b=>b.addEventListener('click',()=>setLev(b.dataset.lev)));

  e.fee.addEventListener('input',x=>setFee(x.target.value));
  e.feeInput.addEventListener('input',syncFeeInput);
  e.feeInput.addEventListener('blur',()=>setFee(e.feeInput.value||0));
  e.feeInput.addEventListener('keydown',x=>{if(x.key==='Enter')e.feeInput.blur()});

  [e.open,e.close,e.pos].forEach(x=>x.addEventListener('input',()=>formatGroupedInput(x)));
  $('calcBtn').addEventListener('click',calc);
  $('resetBtn').addEventListener('click',reset);

  load();
  e.long.classList.toggle('active',side==='long');
  e.short.classList.toggle('active',side==='short');
  document.querySelectorAll('[data-lev]').forEach(b=>b.classList.toggle('on',Number(b.dataset.lev)===Number(e.levInput.value)));
  updateMarginHint();
  clearResults();
})();
</script>
</body>
</html>
