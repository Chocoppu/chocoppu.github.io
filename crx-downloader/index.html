<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>CRX Downloader</title>
<style>
  :root{
    --bg:#f5f7fb;
    --card:#ffffff;
    --text:#17191c;
    --muted:#6b7280;
    --border:#d9dee7;
    --accent:#2563eb;
    --accent-text:#ffffff;
    --danger:#b42318;
    --ok:#067647;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#101216;
      --card:#181b20;
      --text:#f4f4f5;
      --muted:#a1a1aa;
      --border:#343943;
      --accent:#3b82f6;
      --accent-text:#ffffff;
      --danger:#f97066;
      --ok:#47cd89;
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;
    padding:24px 14px;
  }
  .wrap{
    width:min(760px,100%);
    margin:0 auto;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    padding:22px;
    box-shadow:0 8px 28px rgba(0,0,0,.07);
  }
  h1{
    margin:0 0 8px;
    font-size:1.55rem;
  }
  p{
    margin:0 0 18px;
    color:var(--muted);
    line-height:1.65;
  }
  label{
    display:block;
    font-weight:700;
    margin:16px 0 8px;
  }
  input, textarea{
    width:100%;
    border:1px solid var(--border);
    border-radius:12px;
    background:transparent;
    color:var(--text);
    padding:13px 14px;
    font:inherit;
    outline:none;
  }
  input:focus, textarea:focus{
    border-color:var(--accent);
  }
  textarea{
    min-height:118px;
    resize:vertical;
    word-break:break-all;
  }
  .row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:12px;
  }
  button, .button-link{
    border:0;
    border-radius:11px;
    padding:11px 15px;
    font:inherit;
    font-weight:700;
    cursor:pointer;
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    justify-content:center;
  }
  .primary{
    background:var(--accent);
    color:var(--accent-text);
  }
  .secondary{
    background:transparent;
    color:var(--text);
    border:1px solid var(--border);
  }
  .info{
    margin-top:14px;
    padding:12px 14px;
    border:1px solid var(--border);
    border-radius:12px;
    color:var(--muted);
    line-height:1.55;
    font-size:.94rem;
  }
  .result{
    display:none;
    margin-top:20px;
    padding-top:18px;
    border-top:1px solid var(--border);
  }
  .status{
    margin-top:10px;
    font-size:.94rem;
    color:var(--muted);
  }
  .status.ok{color:var(--ok)}
  .status.error{color:var(--danger)}
  .small{
    margin-top:14px;
    color:var(--muted);
    font-size:.86rem;
    line-height:1.55;
  }
  code{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>CRX Downloader</h1>
    <p>Chrome Web Store のURL、または32文字の拡張機能IDから、CRX取得用リンクを生成します。</p>

    <div class="info">
      使用するブラウザバージョン:
      <strong id="browserVersion">判定中...</strong><br>
      Edge / Chrome / Chromium のバージョンを自動判定します。
    </div>

    <label for="source">Chrome Web Store URL / 拡張機能ID</label>
    <input
      id="source"
      autocomplete="off"
      autocapitalize="off"
      spellcheck="false"
      placeholder="https://chromewebstore.google.com/detail/.../clngdbkpkpeebahjckkjfobafhncgmne">

    <div class="row">
      <button id="generate" class="primary">CRXリンクに変換</button>
      <button id="clear" class="secondary">クリア</button>
    </div>

    <div id="message" class="status"></div>

    <div id="result" class="result">
      <label for="output">CRXダウンロードリンク</label>
      <textarea id="output" readonly></textarea>

      <div class="row">
        <button id="copy" class="secondary">リンクをコピー</button>
        <a id="open" class="button-link primary" href="#" target="_blank" rel="noopener">
          CRXをダウンロード
        </a>
      </div>

      <div class="small">
        取得先は Google の <code>clients2.google.com/service/update2/crx</code> です。
        ブラウザや拡張機能の配布条件によっては、CRXが取得できない場合があります。
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';

  const FALLBACK_VERSION = '155.0.0.0';

  const source = document.getElementById('source');
  const output = document.getElementById('output');
  const result = document.getElementById('result');
  const message = document.getElementById('message');
  const openLink = document.getElementById('open');
  const versionLabel = document.getElementById('browserVersion');

  let detectedProdVersion = FALLBACK_VERSION;

  function setStatus(text, type = '') {
    message.textContent = text;
    message.className = 'status' + (type ? ' ' + type : '');
  }

  function normalizeMajorVersion(value) {
    const m = String(value || '').match(/^(\d+)/);
    return m ? `${m[1]}.0.0.0` : null;
  }

  async function detectBrowserVersion() {
    try {
      // Chromium系ブラウザで利用可能なら、より正確なブランド情報を取得。
      if (navigator.userAgentData?.getHighEntropyValues) {
        const data = await navigator.userAgentData.getHighEntropyValues([
          'fullVersionList'
        ]);

        const list = data.fullVersionList || [];

        const preferred =
          list.find(x => /Microsoft Edge/i.test(x.brand)) ||
          list.find(x => /Google Chrome/i.test(x.brand)) ||
          list.find(x => /^Chromium$/i.test(x.brand));

        if (preferred) {
          const normalized = normalizeMajorVersion(preferred.version);
          if (normalized) return normalized;
        }
      }
    } catch (_) {}

    // Android Edge / Desktop Edge / Chrome の順で通常UAを確認。
    const ua = navigator.userAgent || '';

    const match =
      ua.match(/EdgA\/(\d+)/i) ||
      ua.match(/EdgiOS\/(\d+)/i) ||
      ua.match(/Edg\/(\d+)/i) ||
      ua.match(/Chrome\/(\d+)/i) ||
      ua.match(/Chromium\/(\d+)/i);

    if (match) {
      return `${match[1]}.0.0.0`;
    }

    return FALLBACK_VERSION;
  }

  function extractExtensionId(value) {
    const v = value.trim();

    // Chromium extension ID: a-p の32文字。
    if (/^[a-p]{32}$/i.test(v)) {
      return v.toLowerCase();
    }

    // Chrome Web Store URLなどから最後の32文字IDを抽出。
    const matches = v.match(/[a-p]{32}/ig);
    if (!matches?.length) return null;

    return matches[matches.length - 1].toLowerCase();
  }

  function makeCrxUrl(id) {
    const x = encodeURIComponent(`id=${id}&uc`);

    return (
      'https://clients2.google.com/service/update2/crx' +
      '?response=redirect' +
      `&prodversion=${encodeURIComponent(detectedProdVersion)}` +
      '&acceptformat=crx2%2Ccrx3' +
      `&x=${x}`
    );
  }

  function generate() {
    const id = extractExtensionId(source.value);

    if (!id) {
      result.style.display = 'none';
      setStatus(
        '有効な拡張機能IDを見つけられませんでした。Chrome Web StoreのURLか32文字のIDを入力してください。',
        'error'
      );
      return;
    }

    const url = makeCrxUrl(id);

    output.value = url;
    openLink.href = url;
    result.style.display = 'block';

    setStatus(
      `拡張機能ID: ${id} / prodversion: ${detectedProdVersion}`,
      'ok'
    );
  }

  document.getElementById('generate').addEventListener('click', generate);

  source.addEventListener('keydown', e => {
    if (e.key === 'Enter') generate();
  });

  document.getElementById('clear').addEventListener('click', () => {
    source.value = '';
    output.value = '';
    result.style.display = 'none';
    setStatus('');
    source.focus();
  });

  document.getElementById('copy').addEventListener('click', async () => {
    if (!output.value) return;

    try {
      await navigator.clipboard.writeText(output.value);
      setStatus('CRXリンクをコピーしました。', 'ok');
    } catch (_) {
      output.focus();
      output.select();
      document.execCommand('copy');
      setStatus('CRXリンクをコピーしました。', 'ok');
    }
  });

  (async () => {
    detectedProdVersion = await detectBrowserVersion();
    versionLabel.textContent = detectedProdVersion;
  })();
})();
</script>
</body>
</html>
