<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CRX Download Link Generator</title>
<style>
:root{color-scheme:light dark;--bg:#f6f7f9;--card:#fff;--text:#171717;--muted:#666;--border:#d9dce1;--accent:#2563eb;--danger:#b42318}
@media(prefers-color-scheme:dark){:root{--bg:#111315;--card:#191c20;--text:#f4f4f5;--muted:#a1a1aa;--border:#34383f;--accent:#60a5fa;--danger:#f97066}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;align-items:flex-start;justify-content:center;padding:28px 16px}.wrap{width:min(760px,100%)}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:22px;box-shadow:0 8px 30px rgba(0,0,0,.07)}h1{font-size:1.45rem;margin:0 0 8px}p{margin:0 0 18px;color:var(--muted);line-height:1.6}label{display:block;font-weight:650;margin-bottom:8px}input,textarea{width:100%;border:1px solid var(--border);border-radius:12px;padding:13px 14px;font:inherit;background:transparent;color:var(--text);outline:none}input:focus,textarea:focus{border-color:var(--accent)}textarea{min-height:115px;resize:vertical;word-break:break-all}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}button,.btnlink{appearance:none;border:0;border-radius:11px;padding:11px 15px;font:inherit;font-weight:650;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.primary{background:var(--accent);color:#fff}.secondary{background:transparent;color:var(--text);border:1px solid var(--border)}.result{margin-top:20px;padding-top:18px;border-top:1px solid var(--border);display:none}.status{margin-top:10px;font-size:.93rem;color:var(--muted)}.error{color:var(--danger)}.small{font-size:.88rem;color:var(--muted);margin-top:16px;line-height:1.55}code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.92em}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<h1>CRX Download Link Generator</h1>
<p>Chrome Web Store のURL、または32文字の拡張機能IDを入力すると、CRX取得用リンクに変換します。処理はすべてこのページ内で行われます。</p>
<label for="source">Chrome Web Store URL / 拡張機能ID</label>
<input id="source" inputmode="url" autocomplete="off" placeholder="例: https://chromewebstore.google.com/detail/.../kpmjjdhbcfebfjgdnpjagcndoelnidfj">
<div class="row"><button class="primary" id="generate">CRXリンクに変換</button><button class="secondary" id="clear">クリア</button></div>
<div id="message" class="status"></div>
<div id="result" class="result">
<label for="output">CRXダウンロードリンク</label>
<textarea id="output" readonly></textarea>
<div class="row"><button class="secondary" id="copy">リンクをコピー</button><a class="btnlink primary" id="open" href="#" target="_blank" rel="noopener">CRXリンクを開く</a></div>
<div class="small">生成形式: <code>clients2.google.com/service/update2/crx</code><br>ブラウザによってはCRXを「ファイルとして保存」せず、拡張機能として処理しようとする場合があります。</div>
</div>
</div></div>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),source=$('source'),output=$('output'),result=$('result'),message=$('message'),open=$('open');function extractId(value){const v=value.trim();if(/^[a-p]{32}$/i.test(v))return v.toLowerCase();const matches=v.match(/[a-p]{32}/ig);if(!matches||matches.length===0)return null;return matches[matches.length-1].toLowerCase()}function makeCrxUrl(id){const x=encodeURIComponent(`id=${id}&uc`);return `https://clients2.google.com/service/update2/crx?response=redirect&prodversion=155.0.0.0&acceptformat=crx2%2Ccrx3&x=${x}`}function generate(){const id=extractId(source.value);if(!id){result.style.display='none';message.textContent='有効なChrome拡張機能IDを見つけられませんでした。32文字のIDかChrome Web StoreのURLを入力してください。';message.className='status error';return}const url=makeCrxUrl(id);output.value=url;open.href=url;result.style.display='block';message.textContent=`拡張機能ID: ${id}`;message.className='status'}$('generate').addEventListener('click',generate);source.addEventListener('keydown',e=>{if(e.key==='Enter')generate()});$('clear').addEventListener('click',()=>{source.value='';output.value='';result.style.display='none';message.textContent='';source.focus()});$('copy').addEventListener('click',async()=>{if(!output.value)return;try{await navigator.clipboard.writeText(output.value);message.textContent='CRXリンクをコピーしました。';message.className='status'}catch{output.focus();output.select();document.execCommand('copy');message.textContent='CRXリンクをコピーしました。';message.className='status'}})})();
</script>
</body>
</html>
